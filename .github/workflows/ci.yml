name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GoodMem.Rag.Sample.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format GoodMem.Rag.Sample.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build GoodMem.Rag.Sample.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GoodMem.Rag.Sample.slnx --configuration Release --no-build
